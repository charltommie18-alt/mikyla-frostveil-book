<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla and the Frostveil Kingdom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 10px;
  }
  .snowflake {
    position: fixed; top: -10px; color: white;
    animation: fall linear infinite; z-index: 1; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  
  .header { 
    text-align: center; color: white; margin-bottom: 15px; 
  }
  .header h1 {
    font-size: 1.6em;
    background: linear-gradient(to right, #ffd700, #fff);
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
  }
  
  .controls-box {
    background: white; 
    border-radius: 15px; 
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .btn-row { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2); 
    color: white;
    border: none; 
    padding: 10px 15px; 
    border-radius: 20px; 
    cursor: pointer;
    font-size: 0.9em;
    flex: 1;
    min-width: 80px;
  }
  .btn:disabled { opacity: 0.5; }
  
  select {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ddd;
    margin: 5px;
    width: calc(50% - 10px);
  }
  
  #status { 
    text-align: center; 
    color: #666; 
    font-size: 0.85em; 
    margin-top: 10px;
    padding: 8px;
    background: #f0f0f0;
    border-radius: 5px;
  }
  
  /* BOOK CONTAINER */
  .book-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 550px;
    margin: 0 auto 15px;
    perspective: 1500px;
  }
  
  .book-page {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #faf8f3, #f5f0e8);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    padding: 20px;
    overflow-y: auto;
    transition: transform 0.6s;
    transform-origin: left center;
    transform-style: preserve-3d;
  }
  
  .book-page.flipped {
    transform: rotateY(-180deg);
  }
  
  .page-content {
    backface-visibility: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .cover-page {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .cover-page h2 { 
    font-size: 1.6em; 
    color: #ffd700; 
    margin: 10px 0; 
  }
  .cover-emoji { font-size: 60px; margin-bottom: 15px; }
  
  .chapter-title {
    font-size: 1.3em; 
    text-align: center; 
    margin-bottom: 10px;
    color: #667eea;
  }
  .quest-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #1e3c72;
    padding: 5px 10px;
    border-radius: 15px;
    font-weight: bold;
    margin: 8px 0;
    font-size: 0.85em;
    width: 100%;
    text-align: center;
  }
  .illustration { 
    font-size: 50px; 
    text-align: center; 
    margin: 10px 0; 
  }
  .story-text { 
    font-size: 0.95em; 
    line-height: 1.6; 
    color: #34495e; 
    flex: 1;
  }
  .story-text p { margin-bottom: 10px; }
  .dialogue {
    background: rgba(102, 126, 234, 0.1);
    padding: 8px;
    border-left: 3px solid #667eea;
    margin: 8px 0;
    border-radius: 5px;
    font-style: italic;
  }
  .character {
    color: #667eea;
    font-weight: bold;
  }
  .page-num { 
    text-align: right;
    color: #999; 
    font-size: 0.8em;
    margin-top: auto;
    padding-top: 10px;
  }

  .nav-buttons { 
    display: flex; 
    justify-content: space-between; 
    max-width: 500px;
    margin: 0 auto;
    gap: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Mikyla and the Frostveil Kingdom</h1>
  <p style="color: #e0f0ff; font-style: italic;">A Magical Quest</p>
</div>

<div class="controls-box">
  <div class="btn-row">
    <button class="btn" onclick="playAudio()">▶️ Play</button>
    <button class="btn" onclick="pauseAudio()" disabled>⏸️ Pause</button>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="prevPage()" disabled>⏮️ Prev</button>
    <button class="btn" onclick="nextPage()">Next ⏭️</button>
  </div>
  <div style="margin-top: 10px;">
    <select id="voiceSelect" onchange="loadVoice()"></select>
    <select id="speedSelect">
      <option value="0.8">Slow</option>
      <option value="1" selected>Normal</option>
      <option value="1.2">Fast</option>
    </select>
  </div>
  <div id="status"> Tap Play to start reading aloud</div>
</div>

<div class="book-container" id="bookContainer">
  <!-- Pages will be inserted here -->
</div>

<div class="nav-buttons">
  <button class="btn" onclick="prevPage()" id="btnPrev" disabled>← Previous</button>
  <button class="btn" onclick="nextPage()" id="btnNext">Next →</button>
</div>

<script>
// STORY PAGES
const pages = [
  {
    type: 'cover',
    emoji: '👸❄️',
    title: 'Mikyla and the Frostveil Kingdom',
    subtitle: 'A Magical Quest Adventure',
    content: 'An Epic Family Adventure'
  },
  {
    type: 'chapter',
    title: 'Chapter 1: The Mysterious Door',
    emoji: '🌲✨🚪',
    text: `The enchanted forest sparkled with fresh snow. Mikyla laughed as snowflakes landed on her pink winter jacket.

Beside her, <span class="character">Chessie</span> (light fawn coat) stood alert and protective. <span class="character">Chloe</span> (rich brown fur) sniffed excitedly at every snowdrift.

<div class="dialogue"><span class="character">"Woof!"</span> Chloe barked, digging frantically at an ancient oak tree.</div>

Mikyla rushed over. Brushing away snow, she gasped. Embedded in the trunk was a wooden door covered in glowing silver runes!

<div class="dialogue"><span class="character">Chessie</span> growled softly, stepping back.</div>

Mikyla touched the ornate handle. With a soft click, it swung open, spilling warm golden light and diamond dust into the air.

A playful wind swept them across the threshold into the unknown!`
  },
  {
    type: 'chapter',
    title: 'Chapter 2: Welcome to Frostveil',
    emoji: '🏰🧚',
    text: `They landed in a breathtaking frozen kingdom. Crystal trees glittered under a twilight sky.

<div class="dialogue"><span class="character">"Oh, thank goodness you're here!"</span> squeaked a tiny voice.</div>

A fairy with mother-of-pearl wings fluttered down in a shimmering blue dress.

<div class="dialogue"><span class="character">"I'm Pip, scout fairy of Frostveil!"</span> she panted. <span class="character">"The wicked witch Morrigan has trapped Queen Sylvia in an eternal slumber at the Crystal Spire!"</span></div>

<div class="dialogue"><span class="character">Chloe</span> let out a brave yip.</div>

<div class="dialogue"><span class="character">Pip</span> continued, <span class="character">"Morrigan wants to freeze everything forever! Only three magical quests can break her spell!"</span></div>

<div class="dialogue"><span class="character">"We'll help you!"</span> Mikyla declared. <span class="character">"Tell us about these quests!"</span></div>`
  },
  {
    type: 'chapter',
    title: 'Quest 1: The Whispering Ice Maze',
    emoji: '🌀🧊🗝️',
    text: `<div class="quest-badge">QUEST 1: The Whispering Ice Maze</div>

<div class="dialogue"><span class="character">"First, navigate the Whispering Ice Maze,"</span> Pip explained. <span class="character">"Its walls echo your deepest fears!"</span></div>

Towering walls of translucent ice appeared before them, seeming to move when they weren't looking.

<div class="dialogue"><span class="character">"I hear whispers..."</span> Mikyla whispered.</div>

<div class="dialogue">"You'll never find the Sunstone!" the walls hissed. "Turn back!"</div>

<div class="dialogue"><span class="character">Chessie</span> barked loudly, detecting the true path. <span class="character">"Trust Chessie!"</span> Mikyla cried.</div>

Following Chessie's lead, they weaved through the maze. <span class="character">Chloe</span> playfully bounded ahead, finding hidden passages.

At the center, they found a glowing key made of starlight!

<div class="dialogue"><span class="character">"The Key of Courage!"</span> Pip cheered. <span class="character">"One quest down!"</span></div>`
  },
  {
    type: 'chapter',
    title: 'Quest 2: The Sunstone Guardian',
    emoji: '🐺💎☀️',
    text: `<div class="quest-badge">QUEST 2: The Sunstone of Glimmerwood</div>

<div class="dialogue"><span class="character">"Now find the Sunstone,"</span> Pip said. <span class="character">"It's guarded by Fenrir, an ancient ice wolf. He's lonely, not evil."</span></div>

Deep in the frozen forest, they found a magnificent wolf made of ice and starlight.

<div class="dialogue"><span class="character">"Who dares seek the Sunstone?"</span> Fenrir's voice echoed.</div>

<div class="dialogue"><span class="character">"We're here to save Frostveil!"</span> Mikyla said bravely.</div>

<div class="dialogue"><span class="character">Fenrir</span> growled. <span class="character">"Why should I trust you?"</span></div>

<div class="dialogue"><span class="character">Chloe</span> bounded forward and licked the wolf's icy paw.</div>

<div class="dialogue"><span class="character">Fenrir</span> softened. <span class="character">"Such kindness... Prove your courage, and the Sunstone is yours."</span></div>

With Chessie's loyalty and Chloe's cleverness, they succeeded! The golden Sunstone appeared in Mikyla's hands!`
  },
  {
    type: 'chapter',
    title: 'Quest 3: The Crystal Spire',
    emoji: '❄️👑⚔️',
    text: `<div class="quest-badge">QUEST 3: The Crystal Spire</div>

<div class="dialogue"><span class="character">"Face Morrigan and awaken Queen Sylvia!"</span> Pip announced.</div>

At the summit, Queen Sylvia sat frozen on her throne. Before her stood Morrigan, crackling with jagged frost.

<div class="dialogue"><span class="character">"You cannot break my winter!"</span> Morrigan cried. <span class="character">"Cold is safe! Cold doesn't leave you!"</span></div>

<div class="dialogue"><span class="character">Mikyla</span> stepped forward with the Sunstone. <span class="character">"Morrigan, we want to help you!"</span></div>

<div class="dialogue"><span class="character">"Help me?"</span> Morrigan's voice cracked. <span class="character">"I lost everyone. The cold keeps the pain away."</span></div>

<div class="dialogue"><span class="character">"But cold keeps love away too,"</span> Mikyla said gently. <span class="character">"Pip never gave up. Fenrir became our friend. You're not alone anymore!"</span></div>

The golden light washed over the Spire. Morrigan's dark ice dissolved into sparkling water.`
  },
  {
    type: 'chapter',
    title: 'The Kingdom Saved!',
    emoji: '✨🌸',
    text: `Morrigan looked at her hands, now warm instead of cold. Tears streamed down her face.

<div class="dialogue"><span class="character">"I forgot what warmth felt like,"</span> she sobbed. <span class="character">"I forgot I didn't have to be alone."</span></div>

The spell shattered! Queen Sylvia stirred and opened her eyes.

<div class="dialogue"><span class="character">Queen Sylvia</span> rose. <span class="character">"You fought ice with warmth and compassion. You saved us all!"</span></div>

The kingdom burst into life! Crystal bells rang. Flowers bloomed in the ice.

<div class="dialogue"><span class="character">Morrigan</span>, now warm, approached. <span class="character">"Will you... be my friend?"</span></div>

<div class="dialogue"><span class="character">Mikyla</span> smiled. <span class="character">"Of course!"</span></div>

Mikyla hugged Chessie and Chloe tightly. As they stepped through the portal home, Mikyla knew this was just the beginning!

<div style="text-align: center; margin-top: 20px; font-size: 1.2em; color: #667eea;"><strong>~ The End ~</strong></div>`
  },
  {
    type: 'cover',
    emoji: '✨🐕🧚',
    title: 'The End',
    subtitle: 'Thank you for reading!',
    content: 'Mikyla, Chessie, and Chloe saved the kingdom!'
  }
];

// VARIABLES
let currentPage = 0;
const totalPages = pages.length;
let isPlaying = false;
let synth = window.speechSynthesis;
let voices = [];
let currentUtterance = null;

// RENDER PAGES
function renderPages() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  
  pages.forEach((page, index) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'book-page';
    pageDiv.style.zIndex = totalPages - index;
    
    if (page.type === 'cover') {
      pageDiv.innerHTML = `
        <div class="page-content cover-page">
          <div class="cover-emoji">${page.emoji}</div>
          <h2>${page.title}</h2>
          <p style="font-size: 1.1em; font-style: italic; margin: 10px 0;">${page.subtitle}</p>
          <p style="color: #ffd700;">${page.content}</p>
          <div class="page-num">${index === 0 ? 'Cover' : 'Back'}</div>
        </div>
      `;
    } else {
      pageDiv.innerHTML = `
        <div class="page-content">
          <div class="illustration">${page.emoji}</div>
          <h2 class="chapter-title">${page.title}</h2>
          <div class="story-text">${page.text}</div>
          <div class="page-num">Page ${index}</div>
        </div>
      `;
    }
    
    container.appendChild(pageDiv);
  });
  
  updateDisplay();
}

// UPDATE DISPLAY
function updateDisplay() {
  const pageElements = document.querySelectorAll('.book-page');
  pageElements.forEach((page, index) => {
    if (index < currentPage) {
      page.classList.add('flipped');
    } else {
      page.classList.remove('flipped');
    }
  });
  
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('btnNext').disabled = currentPage === totalPages - 1;
  
  const statusEl = document.getElementById('status');
  if (pages[currentPage].type === 'cover') {
    statusEl.textContent = '📖 Cover page - Tap Next for Chapter 1';
  } else {
    statusEl.textContent = `📖 Page ${currentPage} of ${totalPages - 1}`;
  }
}

// NAVIGATION
function nextPage() {
  if (currentPage < totalPages - 1) {
    currentPage++;
    updateDisplay();
    if (isPlaying) {
      setTimeout(playCurrentPage, 600);
    }
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    updateDisplay();
    if (isPlaying) {
      setTimeout(playCurrentPage, 600);
    }
  }
}

// AUDIO FUNCTIONS
function loadVoices() {
  voices = synth.getVoices();
  const select = document.getElementById('voiceSelect');
  select.innerHTML = '';
  
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = i;
    select.appendChild(option);
  });
}

function loadVoice() {
  // Voice will be loaded when playing
}

function playAudio() {
  if (pages[currentPage].type === 'cover') {
    document.getElementById('status').textContent = '⚠️ Navigate to Chapter 1 for audio';
    return;
  }
  
  isPlaying = true;
  document.getElementById('status').textContent = '🔊 Reading...';
  playCurrentPage();
}

function pauseAudio() {
  synth.cancel();
  isPlaying = false;
  document.getElementById('status').textContent = '⏸️ Paused';
}

function playCurrentPage() {
  if (pages[currentPage].type === 'cover') return;
  
  synth.cancel();
  
  // Get clean text (remove HTML tags)
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = pages[currentPage].text;
  const cleanText = tempDiv.textContent || tempDiv.innerText || "";
  
  currentUtterance = new SpeechSynthesisUtterance(cleanText);
  
  const voiceIndex = document.getElementById('voiceSelect').value;
  if (voices[voiceIndex]) {
    currentUtterance.voice = voices[voiceIndex];
  }
  
  currentUtterance.rate = parseFloat(document.getElementById('speedSelect').value);
  currentUtterance.pitch = 1.05;
  
  currentUtterance.onend = function() {
    isPlaying = false;
    document.getElementById('status').textContent = '✅ Finished page ' + currentPage;
  };
  
  currentUtterance.onerror = function() {
    isPlaying = false;
    document.getElementById('status').textContent = '❌ Audio error - try again';
  };
  
  synth.speak(currentUtterance);
  document.getElementById('status').textContent = '🔊 Reading page ' + currentPage + '...';
}

// SNOWFALL EFFECT
function createSnowfall() {
  for (let i = 0; i < 30; i++) {
    const snowflake = document.createElement('div');
    snowflake.className = 'snowflake';
    snowflake.textContent = '❄';
    snowflake.style.left = Math.random() * 100 + 'vw';
    snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
    snowflake.style.animationDelay = Math.random() * 5 + 's';
    snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(snowflake);
  }
}

// INITIALIZE
window.onload = function() {
  renderPages();
  createSnowfall();
  
  // Load voices
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
};
</script>

</body>
</html>
