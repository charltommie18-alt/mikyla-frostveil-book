<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla and the Frostveil Kingdom - Magical Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .snowflake {
    position: fixed; top: -10px; color: white;
    animation: fall linear infinite; z-index: 1; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  
  .header { text-align: center; color: white; margin-bottom: 20px; z-index: 10; }
  .header h1 {
    font-size: 2em;
    background: linear-gradient(to right, #ffd700, #fff, #87ceeb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .audio-player {
    background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px;
    width: 100%; max-width: 800px; margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 10;
  }
  .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
    border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer;
    font-size: 1em; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .flipbook {
    perspective: 2000px; width: 100%; max-width: 800px; height: 650px;
    position: relative; z-index: 10; margin-bottom: 20px;
  }
  .book { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .page {
    position: absolute; width: 100%; height: 100%;
    transform-origin: left center; transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .page.flipped { transform: rotateY(-180deg); }
  .page-front, .page-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    background: linear-gradient(135deg, #faf8f3, #f5f0e8);
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    padding: 30px; overflow-y: auto;
  }
  .page-back { transform: rotateY(180deg); }
  
  .cover {
    background: linear-gradient(135deg, #1e3c72, #2a5298); color: white;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; height: 100%;
  }
  .cover h2 { font-size: 2em; color: #ffd700; margin: 15px 0; }
  .cover .emoji { font-size: 80px; margin-bottom: 20px; }
  
  .chapter-title {
    font-size: 1.5em; text-align: center; margin-bottom: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .quest-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #1e3c72;
    padding: 6px 15px;
    border-radius: 15px;
    font-weight: bold;
    margin: 10px 0;
    font-size: 0.9em;
  }
  .illustration { font-size: 50px; text-align: center; margin: 15px 0; }
  .story-text { font-size: 1.05em; line-height: 1.7; color: #34495e; text-align: justify; }
  .story-text p { margin-bottom: 12px; }
  .dialogue {
    background: rgba(102, 126, 234, 0.1);
    padding: 10px;
    border-left: 3px solid #667eea;
    margin: 10px 0;
    border-radius: 5px;
    font-style: italic;
  }
  .character-name {
    color: #667eea;
    font-weight: bold;
  }
  .page-num { position: absolute; bottom: 15px; right: 30px; color: #999; font-size: 0.85em; }

  .nav-btns { display: flex; justify-content: space-between; width: 100%; max-width: 800px; z-index: 10; }
  
  #status { text-align: center; color: #666; margin-top: 10px; font-size: 0.9em; }
  
  .voice-selector {
    margin-top: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
  }
  select {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ddd;
    margin: 5px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Mikyla and the Frostveil Kingdom</h1>
  <p style="color: #e0f0ff;">A Magical Quest Adventure</p>
</div>

<div class="audio-player">
  <div class="controls">
    <button class="btn" id="playBtn" onclick="togglePlay()">▶️ Play</button>
    <button class="btn" id="pauseBtn" onclick="pauseAudio()" disabled>⏸️ Pause</button>
    <button class="btn" id="prevBtn" onclick="prevPage()" disabled>⏮️ Prev</button>
    <button class="btn" id="nextBtn" onclick="nextPage()">Next ⏭️</button>
  </div>
  <div class="voice-selector">
    <label for="voiceSelect">🎙️ Voice:</label>
    <select id="voiceSelect" onchange="changeVoice()"></select>
    <label for="rateSelect">Speed:</label>
    <select id="rateSelect" onchange="changeSpeed()">
      <option value="0.8">Slow</option>
      <option value="1" selected>Normal</option>
      <option value="1.2">Fast</option>
    </select>
  </div>
  <div id="status">Tap anywhere to enable audio, then tap Play</div>
</div>

<div class="flipbook">
  <div class="book" id="book"></div>
</div>

<div class="nav-btns">
  <button class="btn" id="navPrev" onclick="prevPage()" disabled>← Previous</button>
  <button class="btn" id="navNext" onclick="nextPage()">Next →</button>
</div>

<script>

Pip unfolded a glowing map. <span class="dialogue"><span class="character-name">"First, you must navigate the Whispering Ice Maze,"</span> she explained. <span class="character-name">"Its shifting walls echo your deepest fears and doubts. Many have entered, but few found their way out!"</span></span>

<span class="dialogue"><span class="character-name">Fenrir</span> softened. <span class="character-name">"Such kindness... I've been alone so long. Very well. Prove your courage, and the Sunstone is yours."</span></span>

    },
    {
      type: 'cover',
      title: 'The End',
      emoji: '✨🐕🧚‍♀️',
      sub: 'Thank you for reading!',
      content: 'Mikyla, Chessie, and Chloe saved the kingdom with courage, kindness, and friendship!'
    }
  ];

  const book = document.getElementById('book');
  let currentPage = 0;
  const total = pagesData.length;
  let synth = window.speechSynthesis;
  let isPlaying = false;
  let audioEnabled = false;
  let currentUtterance = null;
  let voices = [];

  // Enable audio on first user interaction
  document.body.addEventListener('click', function enableAudio() {
    audioEnabled = true;
    document.getElementById('status').textContent = 'Audio enabled! Tap Play to start reading.';
  }, { once: true });

  function loadVoices() {
    voices = synth.getVoices();
    const select = document.getElementById('voiceSelect');
    select.innerHTML = '';
    
    voices.forEach((voice, i) => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang})`;
      option.value = i;
      select.appendChild(option);
    });
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function renderPages() {
    pagesData.forEach((page, i) => {
      const el = document.createElement('div');
      el.className = 'page';
      el.style.zIndex = total - i;
      
      if (page.type === 'cover') {
        el.innerHTML = `<div class="page-front cover"><div class="emoji">${page.emoji}</div><h2>${page.title}</h2><p style="font-size:1.2em; font-style:italic; margin:15px 0;">${page.sub}</p><p style="font-size:1.1em; color:#ffd700;">${page.content}</p><div class="page-num">${i === 0 ? 'Cover' : 'Back'}</div></div>`;
      } else {
        el.innerHTML = `<div class="page-front"><div class="illustration">${page.emoji}</div><h2 class="chapter-title">${page.title}</h2><div class="story-text">${page.text}</div><div class="page-num">${i}</div></div>`;
      }
      book.appendChild(el);
    });
  }
  renderPages();

  function updateUI() {
    const pages = document.querySelectorAll('.page');
    pages.forEach((p, i) => {
      if (i < currentPage) p.classList.add('flipped');
      else p.classList.remove('flipped');
    });
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('navPrev').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === total - 1;
    document.getElementById('navNext').disabled = currentPage === total - 1;
    document.getElementById('playBtn').disabled = isPlaying;
    document.getElementById('pauseBtn').disabled = !isPlaying;
  }

  function speakCurrentPage() {
    if (!audioEnabled) {
      alert('Please tap anywhere on the page first to enable audio, then tap Play.');
      return;
    }
    
    if (pagesData[currentPage].type === 'cover') {
      document.getElementById('status').textContent = 'Cover page - no audio. Navigate to a chapter.';
      return;
    }

    synth.cancel();
    
    // Strip HTML tags for speech
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = pagesData[currentPage].text;
    const cleanText = tempDiv.textContent || tempDiv.innerText || "";
    
    currentUtterance = new SpeechSynthesisUtterance(cleanText);
    
    const voiceIdx = document.getElementById('voiceSelect').value;
    if (voices[voiceIdx]) currentUtterance.voice = voices[voiceIdx];
    currentUtterance.rate = parseFloat(document.getElementById('rateSelect').value);
    currentUtterance.pitch = 1.1;
    
    currentUtterance.onend = () => {
      isPlaying = false;
      document.getElementById('status').textContent = 'Finished reading page ' + (currentPage + 1);
      updateUI();
    };
    
    currentUtterance.onerror = () => {
      isPlaying = false;
      updateUI();
    };
    
    synth.speak(currentUtterance);
    document.getElementById('status').textContent = 'Reading page ' + (currentPage + 1) + '...';
  }

  function togglePlay() {
    if (!audioEnabled) {
      alert('Tap anywhere on the screen first to enable audio.');
      return;
    }
    
    if (isPlaying) {
      pauseAudio();
    } else {
      isPlaying = true;
      speakCurrentPage();
      updateUI();
    }
  }

  function pauseAudio() {
    synth.pause();
    isPlaying = false;
    document.getElementById('status').textContent = 'Paused';
    updateUI();
  }

  function changeVoice() {
    if (currentUtterance && voices[document.getElementById('voiceSelect').value]) {
      currentUtterance.voice = voices[document.getElementById('voiceSelect').value];
    }
  }

  function changeSpeed() {
    if (currentUtterance) {
      currentUtterance.rate = parseFloat(document.getElementById('rateSel
