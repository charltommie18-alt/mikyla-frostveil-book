<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla and the Frostveil Kingdom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .snowflake {
    position: fixed; top: -10px; color: white;
    animation: fall linear infinite; z-index: 1; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  
  .header { text-align: center; color: white; margin-bottom: 20px; z-index: 10; }
  .header h1 {
    font-size: 2em;
    background: linear-gradient(to right, #ffd700, #fff, #87ceeb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .audio-player {
    background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px;
    width: 100%; max-width: 800px; margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 10;
  }
  .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
    border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer;
    font-size: 1em; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .flipbook {
    perspective: 2000px; width: 100%; max-width: 800px; height: 600px;
    position: relative; z-index: 10; margin-bottom: 20px;
  }
  .book { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .page {
    position: absolute; width: 100%; height: 100%;
    transform-origin: left center; transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .page.flipped { transform: rotateY(-180deg); }
  .page-front, .page-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    background: linear-gradient(135deg, #faf8f3, #f5f0e8);
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    padding: 40px; overflow-y: auto;
  }
  .page-back { transform: rotateY(180deg); }
  
  .cover {
    background: linear-gradient(135deg, #1e3c72, #2a5298); color: white;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; height: 100%;
  }
  .cover h2 { font-size: 2.2em; color: #ffd700; margin: 20px 0; }
  .cover .emoji { font-size: 80px; margin-bottom: 20px; }
  
  .chapter-title {
    font-size: 1.6em; text-align: center; margin-bottom: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .illustration { font-size: 60px; text-align: center; margin: 20px 0; }
  .story-text { font-size: 1.1em; line-height: 1.8; color: #34495e; text-align: justify; }
  .story-text p { margin-bottom: 15px; }
  .page-num { position: absolute; bottom: 15px; right: 40px; color: #999; }

  .nav-btns { display: flex; justify-content: space-between; width: 100%; max-width: 800px; z-index: 10; }
  
  #status { text-align: center; color: #666; margin-top: 10px; font-size: 0.9em; }
</style>
</head>
<body>

<div class="header">
  <h1>Mikyla and the Frostveil Kingdom</h1>
  <p style="color: #e0f0ff;">A Magical Journey Awaits</p>
</div>

<div class="audio-player">
  <div class="controls">
    <button class="btn" id="playBtn" onclick="togglePlay()">▶️ Play</button>
    <button class="btn" id="prevBtn" onclick="prevPage()" disabled>⏮️ Prev</button>
    <button class="btn" id="nextBtn" onclick="nextPage()">Next ⏭️</button>
  </div>
  <div id="status">Tap anywhere to enable audio, then tap Play</div>
</div>

<div class="flipbook">
  <div class="book" id="book"></div>
</div>

<div class="nav-btns">
  <button class="btn" id="navPrev" onclick="prevPage()" disabled>← Previous</button>
  <button class="btn" id="navNext" onclick="nextPage()">Next →</button>
</div>

<script>
  const pagesData = [
    { type: 'cover', title: 'Mikyla and the Frostveil Kingdom', emoji: '🧚‍♀️️', sub: 'A Magical Journey Awaits', content: 'An Epic Family Adventure' },
    { type: 'chapter', title: 'Chapter 1: The Glowing Door', emoji: '🌳✨🚪', text: 'The air was crisp and biting. Mikyla laughed as she caught a snowflake. Her dogs Chessie and Chloe were having the time of their lives. Suddenly, Chloe dug at an ancient oak tree. Mikyla gasped - there was a door with glowing silver runes! She touched the handle. It opened, spilling golden light. They were swept into the unknown!' },
    { type: 'chapter', title: 'Chapter 2: Welcome to Frostveil', emoji: '🧊', text: 'They stood in a frozen fairyland. Crystal trees glittered. "Thank goodness you\'re here!" squeaked Pip, a tiny fairy. "The witch Morrigan locked Queen Sylvia in a deep slumber! She wants to freeze everything forever!" "We\'ll help you," Mikyla said firmly.' },
    { type: 'chapter', title: 'Chapter 3: The Three-Part Quest', emoji: '️🌀', text: 'Pip showed a glowing map. "Three trials: First, the Whispering Ice Maze. Second, the Sunstone guarded by a lonely ice wolf. Third, face Morrigan at the Crystal Spire." Mikyla gripped her gloves and followed her dogs into the unknown.' },
    { type: 'chapter', title: 'Chapter 4: Warmth Wins', emoji: '❄️🔥', text: 'At the Spire, Morrigan crackled with frost. "You cannot break my winter!" Instead of fighting, Mikyla held up the Sunstone. "You don\'t have to be cold. True magic is warmth and friendship." The golden light melted the ice. Queen Sylvia awoke. The kingdom burst into spring. Mikyla hugged her dogs - they saved the realm!' },
    { type: 'cover', title: 'The End', emoji: '✨', sub: 'The adventure continues...', content: 'Thank you for reading!' }
  ];

  const book = document.getElementById('book');
  let currentPage = 0;
  const total = pagesData.length;
  let synth = window.speechSynthesis;
  let isPlaying = false;
  let audioEnabled = false;

  // Enable audio on first user interaction
  document.body.addEventListener('click', function enableAudio() {
    audioEnabled = true;
    document.getElementById('status').textContent = 'Audio enabled! Tap Play to start reading.';
    document.body.removeEventListener('click', enableAudio);
  }, { once: false });

  function renderPages() {
    pagesData.forEach((page, i) => {
      const el = document.createElement('div');
      el.className = 'page';
      el.style.zIndex = total - i;
      
      if (page.type === 'cover') {
        el.innerHTML = `<div class="page-front cover"><div class="emoji">${page.emoji}</div><h2>${page.title}</h2><p style="font-size:1.3em; font-style:italic; margin:15px 0;">${page.sub}</p><p style="font-size:1.1em; color:#ffd700;">${page.content}</p><div class="page-num">${i === 0 ? 'Cover' : 'Back'}</div></div>`;
      } else {
        el.innerHTML = `<div class="page-front"><div class="illustration">${page.emoji}</div><h2 class="chapter-title">${page.title}</h2><div class="story-text"><p>${page.text}</p></div><div class="page-num">${i}</div></div>`;
      }
      book.appendChild(el);
    });
  }
  renderPages();

  function updateUI() {
    const pages = document.querySelectorAll('.page');
    pages.forEach((p, i) => {
      if (i < currentPage) p.classList.add('flipped');
      else p.classList.remove('flipped');
    });
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('navPrev').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === total - 1;
    document.getElementById('navNext').disabled = currentPage === total - 1;
  }

  function speakCurrentPage() {
    if (!audioEnabled) {
      alert('Please tap anywhere on the page first to enable audio, then tap Play.');
      return;
    }
    
    if (currentPage >= total - 1 || pagesData[currentPage].type === 'cover') {
      document.getElementById('status').textContent = 'No audio for cover pages. Navigate to a chapter.';
      return;
    }

    synth.cancel();
    const text = pagesData[currentPage].text;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.9;
    utterance.pitch = 1.1;
    
    utterance.onend = () => {
      isPlaying = false;
      document.getElementById('playBtn').innerHTML = '▶️ Play';
      document.getElementById('status').textContent = 'Finished reading page ' + (currentPage + 1);
    };
    
    synth.speak(utterance);
    document.getElementById('status').textContent = 'Reading page ' + (currentPage + 1) + '...';
  }

  function togglePlay() {
    if (!audioEnabled) {
      alert('Tap anywhere on the screen first to enable audio, then try Play again.');
      return;
    }
    
    if (isPlaying) {
      synth.cancel();
      isPlaying = false;
      document.getElementById('playBtn').innerHTML = '▶️ Play';
      document.getElementById('status').textContent = 'Paused';
    } else {
      isPlaying = true;
      document.getElementById('playBtn').innerHTML = '⏸️ Pause';
      speakCurrentPage();
    }
  }

  function nextPage() {
    if (currentPage < total - 1) {
      currentPage++;
      updateUI();
      if (isPlaying) {
        setTimeout(speakCurrentPage, 500);
      }
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      updateUI();
      if (isPlaying) {
        setTimeout(speakCurrentPage, 500);
      }
    }
  }

  // Snowfall
  for(let i=0; i<40; i++) {
    const s = document.createElement('div');
    s.className = 'snowflake';
    s.textContent = '❄';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's';
    s.style.animationDelay = Math.random() * 5 + 's';
    s.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(s);
  }

  updateUI();
</script>
</body>
 </html>
