<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla and the Frostveil Kingdom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 10px;
  }
  .snowflake {
    position: fixed; top: -10px; color: white;
    animation: fall linear infinite; z-index: 1; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  
  .header { 
    text-align: center; color: white; margin-bottom: 15px; 
  }
  .header h1 {
    font-size: 1.6em;
    background: linear-gradient(to right, #ffd700, #fff);
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
  }
  
  .controls-box {
    background: white; 
    border-radius: 15px; 
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .btn-row { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2); 
    color: white;
    border: none; 
    padding: 10px 15px; 
    border-radius: 20px; 
    cursor: pointer;
    font-size: 0.9em;
    flex: 1;
    min-width: 80px;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  select {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ddd;
    margin: 5px;
    width: calc(50% - 10px);
    font-size: 0.85em;
  }
  
  #status { 
    text-align: center; 
    color: #666; 
    font-size: 0.85em; 
    margin-top: 10px;
    padding: 8px;
    background: #f0f0f0;
    border-radius: 5px;
  }
  
  .book-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 550px;
    margin: 0 auto 15px;
    perspective: 1500px;
  }
  
  .book-page {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #faf8f3, #f5f0e8);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    padding: 20px;
    overflow-y: auto;
    transition: transform 0.6s;
    transform-origin: left center;
    transform-style: preserve-3d;
  }
  
  .book-page.flipped {
    transform: rotateY(-180deg);
  }
  
  .page-content {
    backface-visibility: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .cover-page {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .cover-page h2 { 
    font-size: 1.6em; 
    color: #ffd700; 
    margin: 10px 0; 
  }
  .cover-emoji { font-size: 60px; margin-bottom: 15px; }
  
  .chapter-title {
    font-size: 1.3em; 
    text-align: center; 
    margin-bottom: 10px;
    color: #667eea;
  }
  .quest-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #1e3c72;
    padding: 5px 10px;
    border-radius: 15px;
    font-weight: bold;
    margin: 8px 0;
    font-size: 0.85em;
    width: 100%;
    text-align: center;
  }
  .illustration { 
    font-size: 50px; 
    text-align: center; 
    margin: 10px 0; 
  }
  .story-text { 
    font-size: 0.95em; 
    line-height: 1.7; 
    color: #34495e; 
    flex: 1;
  }
  .story-text p { margin-bottom: 10px; }
  
  /* READ-ALONG HIGHLIGHTING */
  .word {
    display: inline;
    padding: 2px 3px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .word.active {
    background-color: #FFD700;
    color: #1e3c72;
    font-weight: bold;
    box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
  }
  
  .dialogue {
    background: rgba(102, 126, 234, 0.1);
    padding: 8px;
    border-left: 3px solid #667eea;
    margin: 8px 0;
    border-radius: 5px;
    font-style: italic;
  }
  .character {
    color: #667eea;
    font-weight: bold;
  }
  .page-num { 
    text-align: right;
    color: #999; 
    font-size: 0.8em;
    margin-top: auto;
    padding-top: 10px;
  }

  .nav-buttons { 
    display: flex; 
    justify-content: space-between; 
    max-width: 500px;
    margin: 0 auto;
    gap: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Mikyla and the Frostveil Kingdom</h1>
  <p style="color: #e0f0ff; font-style: italic;">A Magical Quest</p>
</div>

<div class="controls-box">
  <div class="btn-row">
    <button class="btn" onclick="playAudio()" id="playBtn">▶️ Play</button>
    <button class="btn" onclick="pauseAudio()" id="pauseBtn" disabled>⏸️ Pause</button>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="prevPage()" id="prevBtn" disabled>️ Prev</button>
    <button class="btn" onclick="nextPage()" id="nextBtn">Next ⏭️</button>
  </div>
  <div style="margin-top: 10px;">
    <select id="voiceSelect" onchange="voiceChanged()"></select>
    <select id="speedSelect" onchange="speedChanged()">
      <option value="0.8">Slow</option>
      <option value="1" selected>Normal</option>
      <option value="1.2">Fast</option>
    </select>
  </div>
  <div id="status">📖 Tap Play to start reading aloud</div>
</div>

<div class="book-container" id="bookContainer">
  <!-- Pages will be inserted here -->
</div>

<div class="nav-buttons">
  <button class="btn" onclick="prevPage()" id="btnPrev" disabled>← Previous</button>
  <button class="btn" onclick="nextPage()" id="btnNext">Next →</button>
</div>

<script>
// STORY PAGES
const pages = [
  {
    type: 'cover',
    emoji: '👸❄️',
    title: 'Mikyla and the Frostveil Kingdom',
    subtitle: 'A Magical Quest Adventure',
    content: 'An Epic Family Adventure'
  },
  {
    type: 'chapter',
    title: 'Chapter 1: The Mysterious Door',
    emoji: '🌲✨',
    text: `The enchanted forest sparkled with fresh snow. Mikyla laughed as snowflakes landed on her pink winter jacket.

Beside her, Chessie (light fawn coat) stood alert and protective. Chloe (rich brown fur) sniffed excitedly at every snowdrift.

"Woof!" Chloe barked, digging frantically at an ancient oak tree.

Mikyla rushed over. Brushing away snow, she gasped. Embedded in the trunk was a wooden door covered in glowing silver runes!

Chessie growled softly, stepping back.

Mikyla touched the ornate handle. With a soft click, it swung open, spilling warm golden light and diamond dust into the air.

A playful wind swept them across the threshold into the unknown!`
  },
  {
    type: 'chapter',
    title: 'Chapter 2: Welcome to Frostveil',
    emoji: '🏰🧚',
    text: `They landed in a breathtaking frozen kingdom. Crystal trees glittered under a twilight sky.

"Oh, thank goodness you're here!" squeaked a tiny voice.

A fairy with mother-of-pearl wings fluttered down in a shimmering blue dress.

"I'm Pip, scout fairy of Frostveil!" she panted. "The wicked witch Morrigan has trapped Queen Sylvia in an eternal slumber at the Crystal Spire!"

Chloe let out a brave yip.

Pip continued, "Morrigan wants to freeze everything forever! Only three magical quests can break her spell!"

"We'll help you!" Mikyla declared. "Tell us about these quests!"`
  },
  {
    type: 'chapter',
    title: 'Quest 1: The Whispering Ice Maze',
    emoji: '🌀🗝️',
    text: `QUEST 1: The Whispering Ice Maze

"First, navigate the Whispering Ice Maze," Pip explained. "Its walls echo your deepest fears!"

Towering walls of translucent ice appeared before them, seeming to move when they weren't looking.

"I hear whispers..." Mikyla whispered.

"You'll never find the Sunstone!" the walls hissed. "Turn back!"

Chessie barked loudly, detecting the true path. "Trust Chessie!" Mikyla cried.

Following Chessie's lead, they weaved through the maze. Chloe playfully bounded ahead, finding hidden passages.

At the center, they found a glowing key made of starlight!

"The Key of Courage!" Pip cheered. "One quest down!"`
  },
  {
    type: 'chapter',
    title: 'Quest 2: The Sunstone Guardian',
    emoji: '🐺💎☀️',
    text: `QUEST 2: The Sunstone of Glimmerwood

"Now find the Sunstone," Pip said. "It's guarded by Fenrir, an ancient ice wolf. He's lonely, not evil."

Deep in the frozen forest, they found a magnificent wolf made of ice and starlight.

"Who dares seek the Sunstone?" Fenrir's voice echoed.

"We're here to save Frostveil!" Mikyla said bravely.

Fenrir growled. "Why should I trust you?"

Chloe bounded forward and licked the wolf's icy paw.

Fenrir softened. "Such kindness... Prove your courage, and the Sunstone is yours."

With Chessie's loyalty and Chloe's cleverness, they succeeded! The golden Sunstone appeared in Mikyla's hands!`
  },
  {
    type: 'chapter',
    title: 'Quest 3: The Crystal Spire',
    emoji: '❄️👑️',
    text: `QUEST 3: The Crystal Spire

"Face Morrigan and awaken Queen Sylvia!" Pip announced.

At the summit, Queen Sylvia sat frozen on her throne. Before her stood Morrigan, crackling with jagged frost.

"You cannot break my winter!" Morrigan cried. "Cold is safe! Cold doesn't leave you!"

Mikyla stepped forward with the Sunstone. "Morrigan, we want to help you!"

"Help me?" Morrigan's voice cracked. "I lost everyone. The cold keeps the pain away."

"But cold keeps love away too," Mikyla said gently. "Pip never gave up. Fenrir became our friend. You're not alone anymore!"

The golden light washed over the Spire. Morrigan's dark ice dissolved into sparkling water.`
  },
  {
    type: 'chapter',
    title: 'The Kingdom Saved!',
    emoji: '✨',
    text: `Morrigan looked at her hands, now warm instead of cold. Tears streamed down her face.

"I forgot what warmth felt like," she sobbed. "I forgot I didn't have to be alone."

The spell shattered! Queen Sylvia stirred and opened her eyes.

Queen Sylvia rose. "You fought ice with warmth and compassion. You saved us all!"

The kingdom burst into life! Crystal bells rang. Flowers bloomed in the ice.

Morrigan, now warm, approached. "Will you... be my friend?"

Mikyla smiled. "Of course!"

Mikyla hugged Chessie and Chloe tightly. As they stepped through the portal home, Mikyla knew this was just the beginning!

~ The End ~`
  },
  {
    type: 'cover',
    emoji: '✨🐕🧚',
    title: 'The End',
    subtitle: 'Thank you for reading!',
    content: 'Mikyla, Chessie, and Chloe saved the kingdom!'
  }
];

// VARIABLES
let currentPage = 0;
const totalPages = pages.length;
let isPlaying = false;
let isPaused = false;
let synth = window.speechSynthesis;
let voices = [];
let currentUtterance = null;
let selectedVoiceIndex = 0;
let currentSpeed = 1;

// RENDER PAGES WITH WORD SPANS
function renderPages() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  
  pages.forEach((page, index) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'book-page';
    pageDiv.style.zIndex = totalPages - index;
    pageDiv.id = `page-${index}`;
    
    if (page.type === 'cover') {
      pageDiv.innerHTML = `
        <div class="page-content cover-page">
          <div class="cover-emoji">${page.emoji}</div>
          <h2>${page.title}</h2>
          <p style="font-size: 1.1em; font-style: italic; margin: 10px 0;">${page.subtitle}</p>
          <p style="color: #ffd700;">${page.content}</p>
          <div class="page-num">${index === 0 ? 'Cover' : 'Back'}</div>
        </div>
      `;
    } else {
      // Wrap each word in a span for highlighting
      const textWithSpans = wrapWordsInSpans(page.text, index);
      pageDiv.innerHTML = `
        <div class="page-content">
          <div class="illustration">${page.emoji}</div>
          <h2 class="chapter-title">${page.title}</h2>
          <div class="story-text" id="story-${index}">${textWithSpans}</div>
          <div class="page-num">Page ${index}</div>
        </div>
      `;
    }
    
    container.appendChild(pageDiv);
  });
  
  updateDisplay();
}

// WRAP WORDS IN SPANS FOR HIGHLIGHTING
function wrapWordsInSpans(text, pageIndex) {
  // Split by paragraphs first
  const paragraphs = text.split('\n\n');
  return paragraphs.map((para, pIdx) => {
    // Split paragraph into words
    const words = para.split(/(\s+)/); // Keep spaces
    const wordsWithSpans = words.map((word, wIdx) => {
      if (word.trim() === '') return word; // Keep spaces as-is
      const wordId = `word-${pageIndex}-${pIdx}-${wIdx}`;
      return `<span class="word" id="${wordId}">${word}</span>`;
    }).join('');
    return `<p>${wordsWithSpans}</p>`;
  }).join('');
}

// UPDATE DISPLAY
function updateDisplay() {
  const pageElements = document.querySelectorAll('.book-page');
  pageElements.forEach((page, index) => {
    if (index < currentPage) {
      page.classList.add('flipped');
    } else {
      page.classList.remove('flipped');
    }
  });
  
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;
  document.getElementById('btnNext').disabled = currentPage === totalPages - 1;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  
  const statusEl = document.getElementById('status');
  if (pages[currentPage].type === 'cover') {
    statusEl.textContent = '📖 Cover page - Tap Next for Chapter 1';
  } else {
    statusEl.textContent = `📖 Page ${currentPage} of ${totalPages - 1}`;
  }
}

// CLEAR ALL HIGHLIGHTS
function clearHighlights() {
  document.querySelectorAll('.word.active').forEach(el => {
    el.classList.remove('active');
  });
}

// NAVIGATION
function nextPage() {
  if (currentPage < totalPages - 1) {
    currentPage++;
    clearHighlights();
    updateDisplay();
    if (isPlaying && !isPaused) {
      setTimeout(playCurrentPage, 600);
    }
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    clearHighlights();
    updateDisplay();
    if (isPlaying && !isPaused) {
      setTimeout(playCurrentPage, 600);
    }
  }
}

// AUDIO FUNCTIONS
function loadVoices() {
  voices = synth.getVoices();
  const select = document.getElementById('voiceSelect');
  select.innerHTML = '';
  
  voices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = i;
    select.appendChild(option);
  });
}

function voiceChanged() {
  const select = document.getElementById('voiceSelect');
  selectedVoiceIndex = parseInt(select.value);
  // If currently playing, restart with new voice
  if (isPlaying && !isPaused) {
    playCurrentPage();
  }
}

function speedChanged() {
  const select = document.getElementById('speedSelect');
  currentSpeed = parseFloat(select.value);
  // If currently playing, update rate
  if (currentUtterance) {
    currentUtterance.rate = currentSpeed;
  }
}

function playAudio() {
  if (pages[currentPage].type === 'cover') {
    document.getElementById('status').textContent = '⚠️ Navigate to Chapter 1 for audio';
    return;
  }
  
  if (isPaused) {
    // Resume from pause
    synth.resume();
    isPaused = false;
    isPlaying = true;
    document.getElementById('status').textContent = '🔊 Reading...';
    updatePlayButtons();
  } else {
    // Start playing
    isPlaying = true;
    isPaused = false;
    document.getElementById('status').textContent = '🔊 Reading...';
    updatePlayButtons();
    playCurrentPage();
  }
}

function pauseAudio() {
  if (isPlaying) {
    synth.pause();
    isPaused = true;
    isPlaying = false;
    document.getElementById('status').textContent = '⏸️ Paused';
    updatePlayButtons();
  }
}

function updatePlayButtons() {
  document.getElementById('playBtn').disabled = isPlaying && !isPaused;
  document.getElementById('pauseBtn').disabled = !isPlaying || isPaused;
}

function playCurrentPage() {
  if (pages[currentPage].type === 'cover') return;
  
  synth.cancel();
  clearHighlights();
  
  // Get clean text (remove HTML tags)
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = pages[currentPage].text;
  const cleanText = tempDiv.textContent || tempDiv.innerText || "";
  
  currentUtterance = new SpeechSynthesisUtterance(cleanText);
  
  // Set voice
  if (voices[selectedVoiceIndex]) {
    currentUtterance.voice = voices[selectedVoiceIndex];
  }
  
  currentUtterance.rate = currentSpeed;
  currentUtterance.pitch = 1.05;
  
  // Track word boundaries for highlighting
  let charIndex = 0;
  const words = cleanText.split(/(\s+)/);
  let wordIndex = 0;
  
  currentUtterance.onboundary = function(event) {
    if (event.name === 'word') {
      // Clear previous highlight
      clearHighlights();
      
      // Find and highlight current word
      const wordId = `word-${currentPage}-0-${wordIndex}`;
      const wordEl = document.getElementById(wordId);
      if (wordEl) {
        wordEl.classList.add('active');
        wordEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      
      wordIndex++;
    }
  };
  
  currentUtterance.onend = function() {
    isPlaying = false;
    isPaused = false;
    clearHighlights();
    document.getElementById('status').textContent = '✅ Finished page ' + currentPage;
    updatePlayButtons();
  };
  
  currentUtterance.onerror = function(e) {
    console.error('Speech error:', e);
    isPlaying = false;
    isPaused = false;
    clearHighlights();
    document.getElementById('status').textContent = '❌ Audio error - try again';
    updatePlayButtons();
  };
  
  synth.speak(currentUtterance);
}

// SNOWFALL EFFECT
function createSnowfall() {
  for (let i = 0; i < 30; i++) {
    const snowflake = document.createElement('div');
    snowflake.className = 'snowflake';
    snowflake.textContent = '❄';
    snowflake.style.left = Math.random() * 100 + 'vw';
    snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
    snowflake.style.animationDelay = Math.random() * 5 + 's';
    snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(snowflake);
  }
}

// INITIALIZE
window.onload = function() {
  renderPages();
  createSnowfall();
  
  // Load voices
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  
  // Set initial button states
  updatePlayButtons();
};
</script>

</body>
</html>
