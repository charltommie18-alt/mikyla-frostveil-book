<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla and the Frostveil Kingdom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 10px;
  }
  .snowflake {
    position: fixed; top: -10px; color: white;
    animation: fall linear infinite; z-index: 1; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh); } }
  
  .header { 
    text-align: center; color: white; margin-bottom: 15px; 
  }
  .header h1 {
    font-size: 1.6em;
    background: linear-gradient(to right, #ffd700, #fff);
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
  }
  
  .controls-box {
    background: white; 
    border-radius: 15px; 
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .btn-row { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2); 
    color: white;
    border: none; 
    padding: 10px 15px; 
    border-radius: 20px; 
    cursor: pointer;
    font-size: 0.9em;
    flex: 1;
    min-width: 80px;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  select {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ddd;
    margin: 5px;
    width: 100%;
    font-size: 0.85em;
  }
  
  #status { 
    text-align: center; 
    color: #666; 
    font-size: 0.85em; 
    margin-top: 10px;
    padding: 8px;
    background: #f0f0f0;
    border-radius: 5px;
  }
  
  .book-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 600px;
    margin: 0 auto 15px;
    perspective: 1500px;
  }
  
  .book-page {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #faf8f3, #f5f0e8);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    padding: 20px;
    overflow-y: auto;
    transition: transform 0.6s;
    transform-origin: left center;
    transform-style: preserve-3d;
  }
  
  .book-page.flipped {
    transform: rotateY(-180deg);
  }
  
  .page-content {
    backface-visibility: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  /* IMPROVED COVER PAGE */
  .cover-page {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
  }
  .cover-emoji { 
    font-size: 70px; 
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .cover-page h2 { 
    font-size: 1.7em; 
    color: #ffd700; 
    margin: 15px 0;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .cover-page .subtitle {
    font-size: 1.2em; 
    font-style: italic; 
    margin: 10px 0;
    color: #e0f0ff;
  }
  .cover-page .content {
    font-size: 1.1em; 
    color: #ffd700;
    margin-top: 20px;
  }
  .page-num { 
    text-align: right;
    color: #999; 
    font-size: 0.8em;
    margin-top: auto;
    padding-top: 10px;
  }
  
  .chapter-title {
    font-size: 1.3em; 
    text-align: center; 
    margin-bottom: 10px;
    color: #667eea;
  }
  .quest-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #1e3c72;
    padding: 5px 10px;
    border-radius: 15px;
    font-weight: bold;
    margin: 8px 0;
    font-size: 0.85em;
    width: 100%;
    text-align: center;
  }
  .illustration { 
    font-size: 50px; 
    text-align: center; 
    margin: 10px 0; 
  }
  .story-text { 
    font-size: 1em; 
    line-height: 1.8; 
    color: #34495e; 
    flex: 1;
  }
  .story-text p { margin-bottom: 12px; }
  
  /* READ-ALONG HIGHLIGHTING - FIXED */
  .word {
    display: inline;
    padding: 2px 3px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .word.active {
    background-color: #FFD700;
    color: #1e3c72;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
    transform: scale(1.1);
  }
  
  .dialogue {
    background: rgba(102, 126, 234, 0.1);
    padding: 8px;
    border-left: 3px solid #667eea;
    margin: 8px 0;
    border-radius: 5px;
    font-style: italic;
  }
  .character {
    color: #667eea;
    font-weight: bold;
  }

  .nav-buttons { 
    display: flex; 
    justify-content: space-between; 
    max-width: 500px;
    margin: 0 auto;
    gap: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Mikyla and the Frostveil Kingdom</h1>
  <p style="color: #e0f0ff; font-style: italic;">A Magical Quest</p>
</div>

<div class="controls-box">
  <div class="btn-row">
    <button class="btn" onclick="playAudio()" id="playBtn">▶️ Play</button>
    <button class="btn" onclick="pauseAudio()" id="pauseBtn" disabled>⏸️ Pause</button>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="prevPage()" id="prevBtn" disabled>⏮️ Prev</button>
    <button class="btn" onclick="nextPage()" id="nextBtn">Next ⏭️</button>
  </div>
  <div style="margin-top: 10px;">
    <select id="speedSelect" onchange="changeSpeed()">
      <option value="0.85">Slow & Clear</option>
      <option value="1" selected>Natural Pace</option>
      <option value="1.1">Slightly Faster</option>
    </select>
  </div>
  <div id="status"> Tap Play to start reading aloud</div>
</div>

<div class="book-container" id="bookContainer"></div>

<div class="nav-buttons">
  <button class="btn" onclick="prevPage()" id="btnPrev" disabled>← Previous</button>
  <button class="btn" onclick="nextPage()" id="btnNext">Next →</button>
</div>

<script>
const pages = [
  {
    type: 'cover',
    emoji: '👸️',
    title: 'Mikyla and the Frostveil Kingdom',
    subtitle: 'A Magical Quest Adventure',
    content: 'An Epic Family Adventure'
  },
  {
    type: 'chapter',
    title: 'Chapter 1: The Mysterious Door',
    emoji: '✨',
    text: `The enchanted forest sparkled with fresh snow. Mikyla laughed as snowflakes landed on her pink winter jacket.

Beside her, Chessie stood alert and protective. Chloe sniffed excitedly at every snowdrift.

"Woof!" Chloe barked, digging frantically at an ancient oak tree.

Mikyla rushed over. Brushing away snow, she gasped. Embedded in the trunk was a wooden door covered in glowing silver runes!

Chessie growled softly, stepping back.

Mikyla touched the ornate handle. With a soft click, it swung open, spilling warm golden light and diamond dust into the air.

A playful wind swept them across the threshold into the unknown!`
  },
  {
    type: 'chapter',
    title: 'Chapter 2: Welcome to Frostveil',
    emoji: '🧚',
    text: `They landed in a breathtaking frozen kingdom. Crystal trees glittered under a twilight sky.

"Oh, thank goodness you're here!" squeaked a tiny voice.

A fairy with mother-of-pearl wings fluttered down in a shimmering blue dress.

"I'm Pip, scout fairy of Frostveil!" she panted. "The wicked witch Morrigan has trapped Queen Sylvia in an eternal slumber at the Crystal Spire!"

Chloe let out a brave yip.

Pip continued, "Morrigan wants to freeze everything forever! Only three magical quests can break her spell!"

"We'll help you!" Mikyla declared. "Tell us about these quests!"`
  },
  {
    type: 'chapter',
    title: 'Quest 1: The Whispering Ice Maze',
    emoji: '🌀️',
    text: `QUEST 1: The Whispering Ice Maze

"First, navigate the Whispering Ice Maze," Pip explained. "Its walls echo your deepest fears!"

Towering walls of translucent ice appeared before them, seeming to move when they weren't looking.

"I hear whispers..." Mikyla whispered.

"You'll never find the Sunstone!" the walls hissed. "Turn back!"

Chessie barked loudly, detecting the true path. "Trust Chessie!" Mikyla cried.

Following Chessie's lead, they weaved through the maze. Chloe playfully bounded ahead, finding hidden passages.

At the center, they found a glowing key made of starlight!

"The Key of Courage!" Pip cheered. "One quest down!"`
  },
  {
    type: 'chapter',
    title: 'Quest 2: The Sunstone Guardian',
    emoji: '💎☀️',
    text: `QUEST 2: The Sunstone of Glimmerwood

"Now find the Sunstone," Pip said. "It's guarded by Fenrir, an ancient ice wolf. He's lonely, not evil."

Deep in the frozen forest, they found a magnificent wolf made of ice and starlight.

"Who dares seek the Sunstone?" Fenrir's voice echoed.

"We're here to save Frostveil!" Mikyla said bravely.

Fenrir growled. "Why should I trust you?"

Chloe bounded forward and licked the wolf's icy paw.

Fenrir softened. "Such kindness... Prove your courage, and the Sunstone is yours."

With Chessie's loyalty and Chloe's cleverness, they succeeded! The golden Sunstone appeared in Mikyla's hands!`
  },
  {
    type: 'chapter',
    title: 'Quest 3: The Crystal Spire',
    emoji: '❄️👑⚔️',
    text: `QUEST 3: The Crystal Spire

"Face Morrigan and awaken Queen Sylvia!" Pip announced.

At the summit, Queen Sylvia sat frozen on her throne. Before her stood Morrigan, crackling with jagged frost.

"You cannot break my winter!" Morrigan cried. "Cold is safe! Cold doesn't leave you!"

Mikyla stepped forward with the Sunstone. "Morrigan, we want to help you!"

"Help me?" Morrigan's voice cracked. "I lost everyone. The cold keeps the pain away."

"But cold keeps love away too," Mikyla said gently. "Pip never gave up. Fenrir became our friend. You're not alone anymore!"

The golden light washed over the Spire. Morrigan's dark ice dissolved into sparkling water.`
  },
  {
    type: 'chapter',
    title: 'The Kingdom Saved!',
    emoji: '✨🌸',
    text: `Morrigan looked at her hands, now warm instead of cold. Tears streamed down her face.

"I forgot what warmth felt like," she sobbed. "I forgot I didn't have to be alone."

The spell shattered! Queen Sylvia stirred and opened her eyes.

Queen Sylvia rose. "You fought ice with warmth and compassion. You saved us all!"

The kingdom burst into life! Crystal bells rang. Flowers bloomed in the ice.

Morrigan, now warm, approached. "Will you... be my friend?"

Mikyla smiled. "Of course!"

Mikyla hugged Chessie and Chloe tightly. As they stepped through the portal home, Mikyla knew this was just the beginning!

~ The End ~`
  },
  {
    type: 'cover',
    emoji: '✨🐕🧚',
    title: 'The End',
    subtitle: 'Thank you for reading!',
    content: 'Mikyla, Chessie, and Chloe saved the kingdom!'
  }
];

let currentPage = 0;
const totalPages = pages.length;
let isPlaying = false;
let isPaused = false;
let synth = window.speechSynthesis;
let currentUtterance = null;
let currentSpeed = 1;
let allWords = [];

function renderPages() {
  const container = document.getElementById('bookContainer');
  container.innerHTML = '';
  
  pages.forEach((page, index) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'book-page';
    pageDiv.style.zIndex = totalPages - index;
    
    if (page.type === 'cover') {
      pageDiv.innerHTML = `
        <div class="page-content cover-page">
          <div class="cover-emoji">${page.emoji}</div>
          <h2>${page.title}</h2>
          <p class="subtitle">${page.subtitle}</p>
          <p class="content">${page.content}</p>
          <div class="page-num">${index === 0 ? 'Cover' : 'Back'}</div>
        </div>
      `;
    } else {
      pageDiv.innerHTML = `
        <div class="page-content">
          <div class="illustration">${page.emoji}</div>
          <h2 class="chapter-title">${page.title}</h2>
          <div class="story-text" id="story-${index}"></div>
          <div class="page-num">Page ${index}</div>
        </div>
      `;
    }
    
    container.appendChild(pageDiv);
  });
  
  // Add word spans after rendering
  wrapWordsInSpans();
  updateDisplay();
}

function wrapWordsInSpans() {
  allWords = [];
  
  pages.forEach((page, pageIndex) => {
    if (page.type === 'chapter') {
      const storyEl = document.getElementById(`story-${pageIndex}`);
      if (storyEl) {
        const paragraphs = page.text.split('\n\n');
        storyEl.innerHTML = paragraphs.map(para => {
          const words = para.split(/(\s+)/);
          const wordsWithSpans = words.map((word, wordIndex) => {
            if (word.trim() === '') return word;
            const wordId = `w-${pageIndex}-${allWords.length}`;
            allWords.push({id: wordId, text: word});
            return `<span class="word" id="${wordId}">${word}</span>`;
          }).join('');
          return `<p>${wordsWithSpans}</p>`;
        }).join('');
      }
    }
  });
}

function updateDisplay() {
  const pageElements = document.querySelectorAll('.book-page');
  pageElements.forEach((page, index) => {
    page.classList.toggle('flipped', index < currentPage);
  });
  
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;
  document.getElementById('btnNext').disabled = currentPage === totalPages - 1;
  
  const statusEl = document.getElementById('status');
  if (pages[currentPage].type === 'cover') {
    statusEl.textContent = '📖 Cover page - Tap Next for Chapter 1';
  } else {
    statusEl.textContent = `📖 Page ${currentPage} of ${totalPages - 1}`;
  }
}

function clearHighlights() {
  document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));
}

function nextPage() {
  if (currentPage < totalPages - 1) {
    currentPage++;
    clearHighlights();
    updateDisplay();
    if (isPlaying && !isPaused) {
      setTimeout(playCurrentPage, 800);
    }
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    clearHighlights();
    updateDisplay();
    if (isPlaying && !isPaused) {
      setTimeout(playCurrentPage, 800);
    }
  }
}

function changeSpeed() {
  currentSpeed = parseFloat(document.getElementById('speedSelect').value);
  if (currentUtterance) {
    currentUtterance.rate = currentSpeed;
  }
}

function playAudio() {
  if (pages[currentPage].type === 'cover') {
    document.getElementById('status').textContent = '⚠️ Navigate to Chapter 1 for audio';
    return;
  }
  
  if (isPaused) {
    isPaused = false;
    isPlaying = true;
    updatePlayButtons();
    playCurrentPage();
  } else if (!isPlaying) {
    isPlaying = true;
    isPaused = false;
    updatePlayButtons();
    playCurrentPage();
  }
}

function pauseAudio() {
  if (isPlaying) {
    synth.cancel();
    isPlaying = false;
    isPaused = true;
    clearHighlights();
    document.getElementById('status').textContent = '⏸️ Paused - Tap Play to resume';
    updatePlayButtons();
  }
}

function updatePlayButtons() {
  document.getElementById('playBtn').disabled = isPlaying;
  document.getElementById('pauseBtn').disabled = !isPlaying;
}

function playCurrentPage() {
  if (pages[currentPage].type === 'cover') return;
  
  synth.cancel();
  clearHighlights();
  
  const page = pages[currentPage];
  currentUtterance = new SpeechSynthesisUtterance(page.text);
  currentUtterance.rate = currentSpeed;
  currentUtterance.pitch = 1.0;
  currentUtterance.volume = 1.0;
  
  let wordIndex = 0;
  const pageWords = allWords.filter(w => w.id.startsWith(`w-${currentPage}-`));
  
  currentUtterance.onboundary = function(event) {
    if (event.name === 'word' && wordIndex < pageWords.length) {
      clearHighlights();
      const wordEl = document.getElementById(pageWords[wordIndex].id);
      if (wordEl) {
        wordEl.classList.add('active');
        wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      wordIndex++;
    }
  };
  
  currentUtterance.onend = function() {
    isPlaying = false;
    isPaused = false;
    clearHighlights();
    document.getElementById('status').textContent = '✅ Finished page ' + currentPage;
    updatePlayButtons();
  };
  
  currentUtterance.onerror = function() {
    isPlaying = false;
    isPaused = false;
    clearHighlights();
    document.getElementById('status').textContent = '❌ Audio error';
    updatePlayButtons();
  };
  
  document.getElementById('status').textContent = '🔊 Reading page ' + currentPage + '...';
  synth.speak(currentUtterance);
}

function createSnowfall() {
  for (let i = 0; i < 30; i++) {
    const snowflake = document.createElement('div');
    snowflake.className = 'snowflake';
    snowflake.textContent = '❄';
    snowflake.style.left = Math.random() * 100 + 'vw';
    snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
    snowflake.style.animationDelay = Math.random() * 5 + 's';
    snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
    document.body.appendChild(snowflake);
  }
}

window.onload = function() {
  renderPages();
  createSnowfall();
  updatePlayButtons();
};
</script>

</body>
 </html>
